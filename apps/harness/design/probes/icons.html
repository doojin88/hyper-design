<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이콘</title>
<style>
:root{color-scheme:light only;
  --bg:#F7F8FA;--card:#FFFFFF;--line:#E5E7EB;--ink:#1F2937;--sub:#6B7280;--soft:#EEF0F3;
  --acc:#2F6BFF;--acc-soft:#EEF3FF;--ok:#166534;--ok-soft:#DCFCE7}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14px/1.5 "Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px 72px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.plain{color:var(--sub);margin:0 0 20px}
h2{font-size:17px;margin:0 0 12px}
h2 small{font-weight:500;color:var(--sub);font-size:13px;margin-left:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:var(--ink);color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
svg{display:block;flex:none}

.layout{display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;align-items:start}
.strip{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;width:132px}
.strip .ax{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden}
.strip .ax b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.save{font:inherit;font-weight:700;font-size:14px;height:40px;width:132px;padding:0;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.save:disabled{opacity:.5;cursor:default}
.save:focus-visible,.opt:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.strip .saved{font-size:12px;font-weight:600;color:var(--ok);text-align:center;min-height:18px}
.strip .count{font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:14px;padding:4px 10px;text-align:center}

.group{margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.wide{grid-column:1/-1}
.head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.big{flex:none;min-width:56px;max-width:190px;height:56px;padding:0 12px;border-radius:12px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden}
.big span{overflow:hidden;text-overflow:ellipsis}
.big.nolabel{padding:0}
.big.tall{height:72px;min-width:72px}
.head h3{font-size:15px;margin:0 0 2px}
.place{font-size:12px;color:var(--sub);margin:0}
.place b{color:var(--ink);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px;padding:12px 6px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.opt:active{background:var(--soft)}
.opt span{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.opt.on{border:2px solid var(--acc);padding:11px 5px 9px;background:var(--acc-soft)}
.opt.on span{color:var(--acc);font-weight:700}
.opt.reco::after{content:"추천";position:absolute;top:-8px;right:6px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--ok);color:#fff}
.demo{margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;font-size:12px;font-weight:700}
.chip.ok{background:var(--ink);color:#fff}
.chip.pend{background:var(--soft);color:var(--sub)}
.bars{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 16px}
.tabbar{width:390px;max-width:100%;height:56px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub);font-weight:600}
.tab.on{color:var(--acc)}
.segbar{width:390px;max-width:100%;display:flex;gap:6px;padding:6px 20px;border:1px solid var(--line);border-radius:12px;background:#fff}
.seg{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px;color:var(--sub);white-space:nowrap}
.seg.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:700}
.tabopts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.tabopts .sub{margin:0 0 6px;font-size:13px;font-weight:700}
.tabopts .sub small{font-weight:500;color:var(--sub);margin-left:6px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fb{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;gap:10px;align-items:flex-start}
textarea{flex:1;font:inherit;font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;color:var(--ink);background:#fff;min-height:72px}
textarea::placeholder{color:#9CA3AF}
.fb .save{width:100px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.strip{position:static;flex-direction:row;flex-wrap:wrap;width:auto;align-items:center}.tabopts{grid-template-columns:repeat(2,1fr)}.fb{flex-direction:column}.fb .save{width:100%}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>아이콘</h1>
<p class="plain">화면에 쓸 작은 그림이에요. 같은 뜻엔 같은 그림 하나만 씁니다.</p>

<div class="layout">
  <div class="strip">
    <div class="ax"><b>1</b><span>아이콘</span></div>
    <button class="save" id="accept-all">전체 추천대로</button>
    <div class="saved" id="saved"></div>
    <div class="count" id="count">바꾼 아이콘 0개</div>
  </div>
  <div id="groups"></div>
</div>

<div class="layout" style="margin-top:8px">
  <div></div>
  <div class="fb">
    <textarea id="text" placeholder="더 하고 싶은 말 (없어도 돼요)"></textarea>
    <button class="save" id="save-text">저장</button>
  </div>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  return r.label&&r.ex?icon+`<span>${esc(r.ex)}</span>`:icon;
}
function sizeText(r){return `앱 <b>${r.app||'—'}</b> · 웹 <b>${r.web||'—'}</b> · 라벨 ${r.label?'함께':'없음'}`;}
function optsHTML(r){
  const sz=Math.min(shownSize(r),24);
  return [r.reco,...r.alts].map(n=>`<button class="opt${n===cur(r.m)?' on':''}${n===r.reco?' reco':''}" data-m="${esc(r.m)}" data-name="${n}" aria-pressed="${n===cur(r.m)}">${svg(n,sz)}<span>${n}</span></button>`).join('');
}
function demoHTML(m){
  if(m==='확정')return `<span class="chip ok">${svg(cur(m),16)}확정</span>`;
  if(m==='정하는 중')return `<span class="chip pend">${svg(cur(m),16)}정하는 중</span>`;
  return '';
}
function cardHTML(r){
  const demo=demoHTML(r.m);
  return `<article class="card" data-m="${esc(r.m)}">
    <div class="head"><div class="big${r.label&&r.ex?'':' nolabel'}${shownSize(r)>24?' tall':''}" data-big>${bigHTML(r)}</div>
      <div><h3>${esc(r.m)}</h3><p class="place">${esc(r.place)} · ${sizeText(r)}</p></div></div>
    ${demo?`<div class="demo" data-demo>${demo}</div>`:''}
    <div class="opts">${optsHTML(r)}</div>
  </article>`;
}
function tabbarHTML(g){
  return `<div class="tabbar" data-tabbar>${g.rows.filter(r=>shows(r,'tab')).map((r,i)=>`<div class="tab${i===0?' on':''}">${svg(cur(r.m),24)}<span>${esc(r.ex)}</span></div>`).join('')}</div>`;
}
function segbarHTML(g){
  return `<div class="segbar" data-segbar>${g.rows.filter(r=>shows(r,'seg')).sort((a,b)=>['흐름','내 준비','소식'].indexOf(a.m)-['흐름','내 준비','소식'].indexOf(b.m)).map((r,i)=>`<div class="seg${i===0?' on':''}">${svg(cur(r.m),24)}<span>${esc(r.ex)}</span></div>`).join('')}</div>`;
}
function tabCardHTML(g){
  return `<article class="card wide" data-tabcard>
    <div class="bars">${tabbarHTML(g)}${segbarHTML(g)}</div>
    <div class="tabopts">${g.rows.map(r=>`<div data-m="${esc(r.m)}"><p class="sub">${esc(r.m)}<small>${esc(r.place)}</small></p><div class="opts">${optsHTML(r)}</div></div>`).join('')}</div>
  </article>`;
}
function renderAll(){
  $('#groups').innerHTML=SPEC.map(g=>`<section class="group" data-group="${g.id}"><h2>${esc(g.title)}<small>${g.rows.length}개</small></h2>
    <div class="grid">${g.id==='tab'?tabCardHTML(g):g.rows.map(cardHTML).join('')}</div></section>`).join('');
  updateCount();
}
function renderRow(m){
  const r=ROW[m];
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.m===m){const on=b.dataset.name===cur(m);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);}});
  const card=[...document.querySelectorAll('.card[data-m]')].find(c=>c.dataset.m===m);
  if(card){$('[data-big]',card).innerHTML=bigHTML(r);const d=$('[data-demo]',card);if(d)d.innerHTML=demoHTML(m);}
  const g=SPEC.find(x=>x.id==='tab');
  if(shows(r,'tab')){const tb=$('[data-tabbar]');if(tb)tb.outerHTML=tabbarHTML(g);}
  if(shows(r,'seg')){const sb=$('[data-segbar]');if(sb)sb.outerHTML=segbarHTML(g);}
}
function updateCount(){$('#count').textContent=`바꾼 아이콘 ${changed().length}개`;}

function buildDoc(){return{unit:'icons',n:1,label:'아이콘',choices:{...state.choices},changed:changed(),text:state.text.trim(),updatedAt:new Date().toISOString()};}
async function persist(doc){
  if(db){await db.doc(DOC_PATH).set(doc);return;}
  try{localStorage.setItem(LS_KEY,JSON.stringify(doc));}catch(_){throw{code:'local_unavailable'};}
}
function errMsg(e){
  switch(e&&e.code){
    case 'not_granted':return '저장 권한이 없어요 — 페이지를 다시 열어 주세요';
    case 'revoked':return '접근이 끊겼어요 — 페이지를 다시 열어 주세요';
    case 'quota_exceeded':return '저장 공간이 가득 찼어요';
    case 'resource_exhausted':return '잠시 뒤 다시 눌러 주세요';
    case 'invalid_argument':return '저장 내용에 문제가 있어요';
    case 'local_unavailable':return '이 브라우저에 저장하지 못했어요';
    default:return '저장 실패, 다시 눌러 주세요';
  }
}
async function save(msg){
  try{await persist(buildDoc());$('#saved').textContent='저장됨 ✓';updateCount();toast(msg||'저장됨 ✓');return true;}
  catch(e){console.warn('feedback save failed',e&&e.code,e);toast(errMsg(e));return false;}
}

$('#groups').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const m=b.dataset.m,n=b.dataset.name;if(!ROW[m]||cur(m)===n)return;
  state.choices[m]=n;renderRow(m);updateCount();save(n===RECO[m]?'추천대로 ✓':`${m} → ${n}`);
});
$('#accept-all').addEventListener('click',async()=>{
  const btn=$('#accept-all');btn.disabled=true;btn.textContent='저장 중…';
  state.choices={...RECO};renderAll();await save('저장됨 ✓ 전체 추천대로');
  btn.disabled=false;btn.textContent='전체 추천대로';
});
$('#text').addEventListener('input',e=>{state.text=e.target.value;});
$('#save-text').addEventListener('click',async()=>{const btn=$('#save-text');btn.disabled=true;btn.textContent='저장 중…';await save();btn.disabled=false;btn.textContent='저장';});

function applyLoaded(d){
  if(!d)return;
  if(d.choices)Object.keys(RECO).forEach(m=>{const n=d.choices[m];if(n&&[ROW[m].reco,...ROW[m].alts].includes(n))state.choices[m]=n;});
  state.text=d.text||'';$('#text').value=state.text;
  $('#saved').textContent='저장됨 ✓';renderAll();
}
async function initFeedback(){
  try{db=(typeof claude!=='undefined'&&claude&&typeof claude.use==='function')?await claude.use("db"):null;}catch(e){console.warn('db unavailable',e&&e.code,e);db=null;}
  if(db){
    try{const snap=await db.collection('feedback').get();const hit=snap.docs.find(x=>x.id==='icons');if(hit)applyLoaded(hit.data());}
    catch(e){console.warn('feedback load failed',e&&e.code,e);toast('저장된 의견을 불러오지 못했어요');}
  }else{
    toast('이 환경에서는 브라우저에만 저장돼요');
    let d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(_){}
    applyLoaded(d);
  }
}
renderAll();
initFeedback();
</script>
</body>
</html>
