<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 가족여행 — 함께 가는 계획</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --ink:#123B3A; --sub:#5B6F6D; --sand:#F6F2EA; --card:#FFFFFF; --line:#E4DDD0; --soft:#EFE9DD;
  --tang:#E8792B; --tang-bg:#FDEBDB; --ok:#2F7D4F; --ok-bg:#E3F2E8; --cand:#B7791F; --cand-bg:#FBF1D9;
  --sea:#1F6F78; --sea-bg:#DFF0F1; --no:#B4443A;
  --white:#FFFFFF; --tang-ink:#B4530F; --tang-line:var(--tang-line); --ok-line:var(--ok-line); --sea-ink:var(--sea-ink); --sea-light:var(--sea-light); --cand-line:var(--cand-line); --cand-soft:var(--cand-soft); --on-ink-soft:var(--on-ink-soft); --shadow:0 8px 24px rgba(0,0,0,.2);
  --r:14px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --fs:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--sand);color:var(--ink);line-height:1.5;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
/* 데모용 보기 전환 바 */
.demo{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--white);padding:8px var(--s4);display:flex;align-items:center;gap:var(--s3);font-size:13px;overflow-x:auto}
.demo b{white-space:nowrap;opacity:.7;font-weight:500}
.demo button{padding:var(--s2) var(--s3);border-radius:999px;background:var(--on-ink-soft);white-space:nowrap;font-weight:600}
.demo button[aria-pressed=true]{background:var(--white);color:var(--ink)}
.demo .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tang);margin-left:var(--s2)}
/* 공통 */
.chip{display:inline-flex;align-items:center;gap:4px;padding:var(--s1) var(--s3);border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--sub);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.cand{background:var(--cand-bg);color:var(--cand)}.chip.tang{background:var(--tang-bg);color:var(--tang-ink)}.chip.sea{background:var(--sea-bg);color:var(--sea)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:var(--r);font-weight:700;background:var(--ink);color:var(--white)}
.btn.tang{background:var(--tang)}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.small{min-height:40px;padding:0 var(--s3);font-size:13px;border-radius:10px}
.btn:hover{filter:brightness(1.1)}.btn.ghost:hover{background:var(--soft);filter:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.row{display:flex;align-items:center;gap:var(--s3)}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--sub);font-size:13px}
h1{font-size:26px;letter-spacing:-.03em;line-height:1.25}
h2{font-size:17px;letter-spacing:-.02em;margin-bottom:var(--s3)}
.section{margin-bottom:var(--s5)}
.grid{display:grid;gap:var(--s3)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
input,select{font:inherit;padding:var(--s3);border:1.5px solid var(--line);border-radius:10px;background:var(--white);min-height:44px;width:100%;color:var(--ink)}
label.f{display:grid;gap:var(--s2);font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:999px;font-weight:700;z-index:50;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
/* 계획자 레이아웃 */
.plan{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 48px)}
.side{padding:var(--s5) var(--s4);border-right:1px solid var(--line);position:sticky;top:48px;height:calc(100vh - 48px);display:flex;flex-direction:column;gap:var(--s2)}
.side .brand{font-weight:800;font-size:18px;letter-spacing:-.02em}.side .brand small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.side a{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r);font-weight:600;color:var(--sub);min-height:44px}
.side a[aria-current=page]{background:var(--ink);color:var(--white)}
.side svg{width:20px;height:20px;flex:none}
.side .badge,.tabbar .badge{background:var(--tang);color:var(--white);border-radius:999px;font-size:11px;padding:0 var(--s2);margin-left:auto;font-weight:800}
.main{padding:var(--s6);max-width:980px;width:100%}
.tabbar{display:none}
.days{display:flex;gap:var(--s2);overflow-x:auto;margin:var(--s4) 0}
.day{padding:var(--s2) var(--s4);border-radius:12px;border:1.5px solid var(--line);background:var(--white);font-weight:700;white-space:nowrap;text-align:center;line-height:1.3}
.day small{display:block;font-weight:500;color:var(--sub);font-size:12px}
.day[aria-selected=true]{background:var(--ink);color:var(--white);border-color:var(--ink)}.day[aria-selected=true] small{color:var(--sea-light)}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--white);border:1px solid var(--line);border-radius:var(--r);align-items:center}
.item.cand{background:var(--cand-bg);border:1.5px dashed var(--cand-line)}
.item .t{font-weight:800;font-variant-numeric:tabular-nums}
.item h3{font-size:16px;letter-spacing:-.02em}
.tools{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:flex-end}
.slot{border:1.5px dashed var(--cand-line);border-radius:var(--r);padding:var(--s3);background:var(--cand-soft);display:grid;gap:var(--s2);margin-bottom:var(--s2)}
.slot>.muted{font-weight:700;color:var(--cand)}
.edit{grid-column:1/-1;display:grid;grid-template-columns:100px 1fr 1fr;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--line)}
.edit .btns{grid-column:1/-1;display:flex;gap:var(--s2);justify-content:flex-end}
.notice{background:var(--sea-bg);color:var(--sea-ink);border-radius:var(--r);padding:var(--s3) var(--s4);display:flex;gap:var(--s3);font-size:14px}
.q{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.sw button[role=switch]{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.sw button[role=switch]::before{content:"";position:absolute;inset:-6px}
.sw button[aria-checked=true]{background:var(--ok)}
.sw button[role=switch]::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--white);transition:.15s}
.sw button[aria-checked=true]::after{left:24px}
/* 가족 레이아웃 (모바일 우선, 큰 글씨) */
.fam{max-width:520px;margin:0 auto;padding:var(--s5) var(--s4) 120px;font-size:var(--fs)}
.fam h1{font-size:1.5em}.fam .muted{font-size:.8em}
.fam .hero{background:var(--ink);color:var(--white);border-radius:20px;padding:var(--s5);margin-bottom:var(--s4)}
.fam .hero .d{font-size:2.2em;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:var(--s2) 0}
.fam .hero .muted{color:var(--sea-light)}
.fam .flow{display:grid;gap:var(--s3)}
.fam .dcard{display:block;background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:var(--s4) var(--s5);width:100%;text-align:left}
.fam .dcard .n{font-weight:800;color:var(--tang);font-size:.85em}
.fam .dcard .l{font-weight:700;letter-spacing:-.02em;margin-top:var(--s1)}
.fam .dcard .l span{display:block}
.fam .dcard .stay{margin-top:var(--s2);font-size:.8em;color:var(--sea);font-weight:700}
.fam .dcard:hover,.fam .todo:hover{border-color:var(--ink)}
.fam .dcard.today{border-color:var(--tang);box-shadow:0 0 0 3px var(--tang-bg)}
.fam .tl{display:grid;gap:0;margin-top:var(--s4)}
.fam .ev{display:grid;grid-template-columns:76px 1fr;gap:var(--s3);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.fam .ev .tm{font-weight:800;font-variant-numeric:tabular-nums}
.fam .ev .tt{font-weight:700;letter-spacing:-.02em}
.fam .ev.meet .tm,.fam .ev.meet .tt{color:var(--tang)}
.fam .ev.wait{color:var(--sub)}.fam .ev.wait .tt{font-weight:600}
.fam .banner{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);background:var(--tang-bg);border:1.5px solid var(--tang-line);border-radius:20px;padding:var(--s4) var(--s5);margin-bottom:var(--s4);width:100%;text-align:left;font-weight:700}
.fam .todo{display:flex;align-items:center;gap:var(--s4);background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:var(--s4) var(--s5);width:100%;text-align:left;min-height:64px;margin-bottom:var(--s3);font-weight:700}
.fam .todo .box{width:32px;height:32px;border-radius:10px;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;color:var(--white);font-size:20px;font-weight:900}
.fam .todo[aria-pressed=true]{background:var(--ok-bg);border-color:var(--ok-line);color:var(--sub)}
.fam .todo[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.fam .todo[aria-pressed=true] span:last-child{text-decoration:line-through}
.fam .news{background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:var(--s5);margin-bottom:var(--s3)}
.fam .news.new{border-color:var(--tang)}
.fam .news li{list-style:none;padding:var(--s2) 0;font-weight:600}
.fam .news li::before{content:"·";margin-right:8px;color:var(--tang);font-weight:900}
.fam .big{min-height:56px;font-size:1em;width:100%;margin-top:var(--s3)}
.famtabs{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:var(--s2) var(--s2) calc(var(--s2) + env(safe-area-inset-bottom));z-index:15}
.famtabs a{display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s2) 0;font-weight:800;font-size:14px;color:var(--sub);min-height:56px;position:relative}
.famtabs a[aria-current=page]{color:var(--ink)}.famtabs a[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:2px;background:var(--tang)}
.famtabs svg{width:26px;height:26px}
.sizebtn{float:right;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:var(--s2) var(--s3);min-height:44px}
.ask{min-height:48px;margin-top:var(--s2);font-size:.8em}
.hint{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.empty{text-align:center;padding:var(--s5);color:var(--sub);border:1.5px dashed var(--line);border-radius:var(--r)}
@media (max-width:820px){
  .btn.small{min-height:44px}
  .plan{grid-template-columns:1fr}.side{display:none}.main{padding:var(--s5) var(--s4) 104px}
  .g2,.g3{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);padding:var(--s2) var(--s1) calc(var(--s2) + env(safe-area-inset-bottom));z-index:15}
  .tabbar a{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;color:var(--sub);min-height:48px;padding:var(--s2) 0;position:relative}
  .tabbar a[aria-current=page]{color:var(--ink)}.tabbar svg{width:22px;height:22px}
  .tabbar .badge{position:absolute;top:var(--s1);right:18%;margin:0}
  .item{grid-template-columns:48px 1fr}.item .tools{grid-column:1/-1;justify-content:flex-start}
  .edit{grid-template-columns:1fr}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div class="demo" id="demo" role="group" aria-label="보기 전환(데모)"></div>
<div id="app"></div>

<script>
/* ---------- 데이터 ---------- */
const TODAY='2026-09-30', START=[2026,10,20];
const PEOPLE=[
 {id:'jisu',name:'지수',role:'계획자',kind:'plan'},
 {id:'minjae',name:'민재',role:'동행',kind:'fam',big:false},
 {id:'youngho',name:'영호',role:'아버지',kind:'fam',big:true},
 {id:'misook',name:'미숙',role:'어머니',kind:'fam',big:true},
];
const FAM=PEOPLE.filter(p=>p.kind==='fam');
const WD=['일','월','화','수','목','금','토'];
const dayDate=n=>new Date(START[0],START[1],START[2]+n);
const dfmt=n=>{const d=dayDate(n);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const dfull=n=>{const d=dayDate(n);return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`};
const dday=()=>Math.round((dayDate(0)-new Date(2026,8,30))/864e5);
const DAYS=5;
let uid=100;
const it=(day,type,time,title,place,status,extra={})=>({id:'i'+(++uid),day,type,time,title,place,status,...extra});
const S={
 who:'jisu', page:{plan:'home',fam:'home'}, day:0, editing:null, adding:false,
 big:{youngho:true,misook:true,minjae:false},
 instant:true,
 items:[
  it(0,'이동','07:40','김포공항 국내선 출발장 집합','김포공항 1층','confirmed',{meet:true}),
  it(0,'이동','09:10','김포 → 제주 비행기 (KE1207)','','confirmed'),
  it(0,'활동','10:40','렌터카 받기','제주공항 렌터카 하우스','confirmed'),
  it(0,'식사','12:20','흑돼지 거리에서 점심','제주 시내','candidate',{slot:'점심'}),
  it(0,'식사','12:20','고기국수 맛집에서 점심','제주 시내','candidate',{slot:'점심'}),
  it(0,'활동','14:30','협재 해변 산책','협재해수욕장','confirmed'),
  it(0,'숙박','16:30','애월 바다 앞 숙소 체크인','애월','confirmed'),
  it(1,'활동','09:30','성산일출봉 오르기 (완만한 길)','성산','confirmed'),
  it(1,'식사','12:30','해녀의집 전복죽','성산','candidate',{slot:'점심'}),
  it(1,'식사','12:30','성게국수','성산','candidate',{slot:'점심'}),
  it(1,'활동','14:30','섭지코지 산책','섭지코지','candidate',{slot:'오후',note:'아버지 무릎 — 걷는 거리 확인 필요'}),
  it(1,'활동','14:30','카멜리아힐 꽃 구경','카멜리아힐','candidate',{slot:'오후'}),
  it(1,'숙박','18:00','애월 숙소에서 하룻밤 더','애월','confirmed'),
  it(2,'활동','09:30','사려니숲길 가벼운 산책','사려니숲','candidate',{slot:'오전'}),
  it(2,'활동','09:30','새별오름 (짧은 코스)','새별오름','candidate',{slot:'오전'}),
  it(2,'식사','12:30','애월 한식당 점심','애월','confirmed'),
  it(2,'활동','15:00','숙소 앞 카페에서 쉬기','애월','confirmed'),
  it(3,'이동','09:00','우도 가는 배 타기','성산항','confirmed',{meet:true}),
  it(3,'활동','11:00','우도 전기자전거 · 산책','우도','candidate',{slot:'오전'}),
  it(3,'숙박','16:00','서귀포 호텔로 옮겨 체크인','서귀포','confirmed'),
  it(4,'숙박','10:00','호텔 체크아웃','서귀포','confirmed'),
  it(4,'활동','11:00','기념품 · 귤 초콜릿 쇼핑','서귀포 올레시장','candidate',{slot:'오전'}),
  it(4,'이동','16:20','제주 → 김포 비행기 (KE1216)','','confirmed'),
 ],
 todos:[
  {id:'t1',title:'신분증 챙기기',who:['jisu','minjae','youngho','misook'],due:'11/19',done:{jisu:1,youngho:1}},
  {id:'t2',title:'상비약 챙기기 (혈압약 포함)',who:['youngho'],due:'11/18',done:{youngho:1}},
  {id:'t3',title:'렌터카 예약 확인',who:['jisu'],due:'10/15',done:{jisu:1}},
  {id:'t4',title:'보조배터리 · 충전기',who:['minjae','youngho','misook'],due:'11/19',done:{}},
  {id:'t5',title:'겉옷 한 벌 (제주 11월은 바람이 셈)',who:['misook','youngho'],due:'11/19',done:{misook:1}},
  {id:'t6',title:'멀미약 사두기',who:['misook'],due:'11/10',done:{}},
  {id:'t7',title:'모바일 탑승권 저장 (부모님 것 대신)',who:['jisu'],due:'11/19',done:{}},
  {id:'t8',title:'숙소 체크인 안내 문자 확인',who:['minjae'],due:'11/15',done:{}},
 ],
 pending:[
  {id:'c1',text:'3일차 우도 배 시간이 09:30에서 09:00으로 바뀌었어요',important:true,day:3},
  {id:'c2',text:'1일차 렌터카 받는 곳이 제주공항 렌터카 하우스로 정해졌어요',important:false,day:0},
 ],
 digests:[
  {id:'d0',at:'9월 25일 저녁 8시',changes:['비행기가 김포 09:10 출발 (KE1207)로 확정됐어요','애월 숙소 4박 예약이 끝났어요'],readBy:['youngho']},
 ],
};
/* 데모 초기 상태: 시나리오를 위해 대기 중 변경의 원본은 이미 반영된 상태로 둠 */
S.items.find(i=>i.title==='우도 가는 배 타기').time='09:00';
S.pending[0].text='3일차 “우도 가는 배 타기” 시간 09:30 → 09:00';S.pending[0].itemId=S.items.find(i=>i.title==='우도 가는 배 타기').id;
S.pending[1].text='1일차 “렌터카 받기” 장소 확정: 제주공항 렌터카 하우스';S.pending[1].itemId=S.items.find(i=>i.title==='렌터카 받기').id;
S.curious=[{day:0,slot:'점심',who:'youngho'}]; /* 부모→계획자 역방향 신호. 알림이 아니라 모아보기 목록 */

/* ---------- 도우미 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>PEOPLE.find(p=>p.id===id);
const me=()=>P(S.who);
const dayItems=d=>S.items.filter(i=>i.day===d);
const conf=d=>dayItems(d).filter(i=>i.status==='confirmed').sort((a,b)=>a.time.localeCompare(b.time));
function slots(d){const m={};dayItems(d).filter(i=>i.slot).forEach(i=>{(m[i.slot]=m[i.slot]||[]).push(i)});return m}
function waitingSlots(d){ /* 확정된 항목이 없는 슬롯 = 부모에게 '정하는 중'으로 보일 자리 */
  return Object.entries(slots(d)).filter(([,a])=>a.every(i=>i.status==='candidate')).map(([k,a])=>({k,time:a[0].time}))}
const unread=id=>S.digests.filter(d=>!d.readBy.includes(id));
const pendingImportant=()=>S.pending.filter(c=>c.important).length;
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 chk:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/>',
 bell:'<path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/>',
 bag:'<path d="M6 8h12l1 12H5zM9 8a3 3 0 016 0"/>',
 map:'<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'};
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
const doneCount=(t)=>t.who.filter(w=>t.done[w]).length;
const myTodos=id=>S.todos.filter(t=>t.who.includes(id));

function publish(changes,at,instant){
  const id='d'+(++uid);S.digests.unshift({id,at,changes:changes.map(c=>c.text),readBy:[],instant:!!instant});
  changes.forEach(c=>{const x=S.items.find(i=>i.id===c.itemId);if(x)x.fresh=id});
}
/* ---------- 변경 기록 (핵심 규칙) ----------
   - 후보 항목의 편집·이동·삭제 → 기록하지 않음 (조용함)
   - 확정 항목의 변경/확정 전환/삭제 → 큐에 쌓음. 중요(이동·숙박 등)는 설정에 따라 즉시 발송 */
function record(text,item,forceQuiet){
  if(forceQuiet)return;
  const important=item&&(item.type==='이동'||item.type==='숙박'||item.meet);
  if(important&&S.instant){publish([{text,itemId:item.id}],'방금 (바로 알림)',true);toast('중요한 변경이라 바로 알렸어요')}
  else{S.pending.push({id:'c'+(++uid),text,important:!!important,day:item?item.day:0,itemId:item&&item.id});}
}

/* ---------- 계획자 화면 ---------- */
const PN=[['home','홈','home'],['edit','일정','cal'],['todo','할 일','chk'],['notify','알림','bell']];
function planShell(body){
  const cur=S.page.plan,badge=S.pending.length;
  const nav=PN.map(([k,l,ic])=>`<a href="#" data-nav="${k}" ${k===cur?'aria-current="page"':''}>${svg(IC[ic])}<span>${l}</span>${k==='notify'&&badge?`<span class="badge">${badge}</span>`:''}</a>`).join('');
  return `<div class="plan"><aside class="side"><div class="brand">제주 4박 5일<small>11/20(금)~11/24(화) · D-${dday()}</small></div>${nav}
   <div style="margin-top:auto" class="muted">가족에게는 <b>확정된 것만</b>,<br>큰 글씨로 보여요.</div></aside>
   <main class="main">${body}</main></div><nav class="tabbar" aria-label="메뉴">${nav}</nav>`;
}
function pHome(){
  const all=S.items,c=all.filter(i=>i.status==='confirmed').length,cd=all.length-c;
  const open=[...Array(DAYS).keys()].reduce((n,d)=>n+waitingSlots(d).length,0);
  const tp=S.todos.reduce((a,t)=>[a[0]+doneCount(t),a[1]+t.who.length],[0,0]);
  const unr=FAM.filter(f=>f.big).map(f=>[f,unread(f.id).length]);
  return `<h1>제주 가족여행</h1><p class="muted" style="margin:4px 0 24px">출발까지 ${dday()}일 · 함께 가는 사람 ${PEOPLE.length}명</p>
  <div class="grid g3 section">
   <div class="card"><div class="muted">확정된 항목</div><b style="font-size:28px">${c}</b><span class="muted"> / ${all.length}</span><div class="bar" style="margin-top:8px"><i style="width:${Math.round(c/all.length*100)}%"></i></div></div>
   <div class="card"><div class="muted">아직 정하는 중인 시간대</div><b style="font-size:28px;color:var(--cand)">${open}</b><div class="muted">후보 ${cd}개 · 가족에게는 보이지 않아요</div></div>
   <div class="card"><div class="muted">준비물 완료</div><b style="font-size:28px">${tp[0]}</b><span class="muted"> / ${tp[1]}</span><div class="bar" style="margin-top:8px"><i style="width:${Math.round(tp[0]/tp[1]*100)}%"></i></div></div>
  </div>
  <div class="card section" style="${S.pending.length?'border-color:var(--tang);border-width:2px':''}">
   <div class="row between wrap"><h2 style="margin:0">아직 가족에게 알리지 않은 변경 ${S.pending.length}건</h2>${S.pending.length?`<button class="btn tang" data-act="send">한 번에 알리기</button>`:''}</div>
   ${S.pending.length?`<ul style="margin-top:12px;padding-left:20px">${S.pending.map(c=>`<li>${esc(c.text)}</li>`).join('')}</ul><p class="muted" style="margin-top:8px">후보를 고친 건 여기에 쌓이지 않아요. 확정된 것만 묶음으로 나가요.</p>`:`<p class="muted" style="margin-top:8px">모두 알렸어요. 후보를 고치는 건 알림이 가지 않으니 편하게 손보세요.</p>`}
  </div>
  <div class="card section"><h2>가족이 궁금해하는 것</h2>
   ${S.curious.length?Object.values(S.curious.reduce((m,c)=>{const k=c.day+':'+c.slot;(m[k]=m[k]||{day:c.day,slot:c.slot,who:[]}).who.push(c.who);return m},{})).map(g=>`<div class="q"><div style="flex:1"><b>${g.day+1}일차 ${g.slot}</b><div class="muted">${g.who.map(w=>P(w).name).join(' · ')} 님이 언제 정해지는지 궁금해해요</div></div><button class="btn ghost small" data-gotoday="${g.day}">일정에서 정하기</button></div>`).join(''):'<div class="empty">아직 없어요. 가족이 궁금해하면 여기에 모여요.</div>'}
   <p class="muted" style="margin-top:var(--s3)">알림은 오지 않아요. 재촉이 아니라, 묻기 미안해서 못 한 질문을 모아 보여드려요.</p></div>
  <div class="section"><h2>가족이 지금 보고 있는 것</h2><div class="grid g2">
   ${FAM.map(f=>`<div class="card row between"><div><b>${f.name}</b> <span class="muted">${f.role}</span><div class="muted">${unread(f.id).length?`소식 ${unread(f.id).length}건 안 읽음`:'모두 확인함'}</div></div><button class="btn ghost small" data-who="${f.id}">이 화면 보기</button></div>`).join('')}
  </div></div>
  <div class="row wrap"><button class="btn ghost" data-nav="edit">일정 손보기</button><button class="btn ghost" data-nav="todo">할 일 나누기</button></div>`;
}
function itemRow(i,idx,list){
  const cand=i.status==='candidate',ed=S.editing===i.id;
  return `<div class="item ${cand?'cand':''}"><div class="t">${i.time}</div>
   <div><div class="row wrap" style="gap:var(--s2)"><span class="chip ${cand?'cand':'ok'}">${cand?'후보':'확정 ✓'}</span><span class="chip ${cand?'':'sea'}">${cand?'가족에게 안 보임':'가족에게 보임'}</span><span class="chip">${i.type}</span>${i.meet?'<span class="chip tang">집합</span>':''}</div>
   <h3 style="margin-top:4px">${esc(i.title)}</h3><div class="muted">${esc(i.place||(i.type==='이동'?'':'장소 미정'))}${i.note?` · ${esc(i.note)}`:''}</div></div>
   <div class="tools"><button class="btn small ${cand?'tang':'ghost'}" data-act="toggle" data-id="${i.id}">${cand?'확정하기':'후보로 되돌리기'}</button>
   <button class="btn small ghost" data-act="up" data-id="${i.id}" aria-label="위로">↑</button><button class="btn small ghost" data-act="down" data-id="${i.id}" aria-label="아래로">↓</button>
   <button class="btn small ghost" data-act="edit" data-id="${i.id}">고치기</button><button class="btn small ghost" data-act="del" data-id="${i.id}" aria-label="삭제">✕</button></div>
   ${ed?`<div class="edit"><label class="f">시간<input id="e-time" value="${i.time}"></label><label class="f">제목<input id="e-title" value="${esc(i.title)}"></label><label class="f">장소<input id="e-place" value="${esc(i.place)}"></label>
    <div class="btns"><button class="btn ghost small" data-act="cancel">취소</button><button class="btn small" data-act="save" data-id="${i.id}">저장</button></div>
    ${!cand?`<div class="muted" style="grid-column:1/-1">확정된 항목이라 저장하면 “알리지 않은 변경”에 쌓여요.</div>`:`<div class="muted" style="grid-column:1/-1">후보라서 몇 번을 고쳐도 가족에게 알림이 가지 않아요.</div>`}</div>`:''}</div>`;
}
function pEdit(){
  const d=S.day,list=dayItems(d).sort((a,b)=>a.time.localeCompare(b.time)||0);
  /* 후보 슬롯은 묶어서 보여준다 */
  const seen=new Set();let html='';
  list.forEach(i=>{
    if(i.slot&&i.status==='candidate'){
      if(seen.has(i.slot))return;seen.add(i.slot);
      const g=list.filter(x=>x.slot===i.slot&&x.status==='candidate');
      html+=`<div class="slot"><div class="muted">${i.slot} 후보 ${g.length}개 — 하나를 확정하면 나머지는 정리돼요 · 가족에게는 “아직 정하는 중”으로만 보여요</div>${g.map(x=>itemRow(x)).join('')}</div>`;
    }else html+=itemRow(i)+'<div style="height:8px"></div>';
  });
  return `<div class="row between wrap"><div><h1>일정 편집</h1><p class="muted">노란 점선은 후보예요. 자유롭게 고쳐도 가족은 모릅니다.</p></div><button class="btn" data-act="addform">+ 항목 추가</button></div>
  <p class="muted hint" style="margin-top:var(--s3)"><span class="chip sea">가족에게 보임 ${conf(d).length}</span><span class="chip cand">숨은 후보 ${dayItems(d).filter(i=>i.status==='candidate').length}</span><span class="chip">정하는 중 ${waitingSlots(d).length}</span></p>
  <div class="days" role="tablist">${[...Array(DAYS).keys()].map(n=>`<button class="day" role="tab" aria-selected="${n===d}" data-day="${n}">${n+1}일차<small>${dfmt(n)}</small></button>`).join('')}</div>
  ${S.adding?`<form class="card section" id="addf"><div class="grid g3"><label class="f">시간<input name="time" value="10:00" required></label><label class="f">종류<select name="type">${['활동','식사','이동','숙박'].map(t=>`<option>${t}</option>`).join('')}</select></label><label class="f">상태<select name="status"><option value="candidate">후보 (가족에게 안 보임)</option><option value="confirmed">확정</option></select></label></div>
   <div class="grid g2" style="margin-top:12px"><label class="f">제목<input name="title" required placeholder="예: 협재 해변 산책"></label><label class="f">장소<input name="place"></label></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button type="button" class="btn ghost" data-act="cancel">취소</button><button class="btn">추가</button></div></form>`:''}
  <div class="grid" style="gap:0">${html||'<div class="empty">아직 항목이 없어요</div>'}</div>`;
}
function pTodo(){
  return `<h1>할 일 · 준비물</h1><p class="muted" style="margin:4px 0 24px">누가 무엇을 챙기는지 한눈에. 각자 자기 것만 체크해요.</p>
  <div class="grid g2 section">${PEOPLE.map(p=>{const l=myTodos(p.id),d=l.filter(t=>t.done[p.id]).length;return `<div class="card"><div class="row between"><b>${p.name}</b><span class="muted">${d}/${l.length}</span></div><div class="bar" style="margin-top:8px"><i style="width:${l.length?Math.round(d/l.length*100):0}%"></i></div></div>`}).join('')}</div>
  <div class="card section">${S.todos.map(t=>`<div class="q"><button class="btn small ${doneCount(t)===t.who.length?'':'ghost'}" style="min-width:44px" data-act="tdone" data-id="${t.id}" aria-label="전체 완료 표시">${doneCount(t)===t.who.length?'✓':'○'}</button><div style="flex:1"><b>${esc(t.title)}</b><div class="muted">${t.who.map(w=>`${P(w).name}${t.done[w]?' ✓':''}`).join(' · ')} · ${t.due}까지</div></div></div>`).join('')}</div>
  <form class="card" id="tf"><h2>할 일 추가</h2><div class="grid g3"><label class="f">할 일<input name="title" required placeholder="예: 여행자 보험"></label><label class="f">담당<select name="who">${PEOPLE.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}<option value="all">가족 모두</option></select></label><label class="f">기한<input name="due" value="11/15"></label></div><button class="btn" style="margin-top:12px">추가</button></form>`;
}
function pNotify(){
  return `<h1>알림 관리</h1><p class="muted" style="margin:4px 0 24px">가족이 “너무 잦은 알림”을 받지 않도록, 보내는 규칙을 정해요.</p>
  <div class="notice section"><span>ⓘ</span><div><b>후보를 고치는 건 절대 알림이 가지 않아요.</b><br>확정된 것이 바뀔 때만 쌓이고, 아래에서 묶어서 보내요.</div></div>
  <div class="card section"><div class="sw"><div><b>항공·숙소·집합 시간이 바뀌면 바로 알리기</b><div class="muted">놓치면 안 되는 것만 예외로 즉시 보내요</div></div><button role="switch" aria-checked="${S.instant}" data-act="instant" aria-label="즉시 알림"></button></div>
   <div class="sw"><div><b>나머지는 묶어서 보내기</b><div class="muted">계획자가 “한 번에 알리기”를 누를 때 1건으로 나가요</div></div><span class="chip ok">사용 중</span></div></div>
  <div class="card section"><div class="row between wrap"><h2 style="margin:0">보내기 전 변경 (${S.pending.length})</h2><button class="btn tang" data-act="send" ${S.pending.length?'':'disabled'}>한 번에 알리기</button></div>
   ${S.pending.length?S.pending.map(c=>`<div class="q"><div style="flex:1"><b>${esc(c.text)}</b><div class="muted">${c.important?'중요 변경':'일반 변경'} · ${dfmt(c.day)}</div></div><button class="btn ghost small" data-act="drop" data-id="${c.id}">알리지 않기</button></div>`).join(''):'<div class="empty" style="margin-top:12px">보낼 변경이 없어요</div>'}</div>
  <div class="card"><h2>보낸 소식</h2>${S.digests.map(d=>`<div class="q"><div style="flex:1"><b>${d.at}</b>${d.instant?' <span class="chip tang">바로 알림</span>':''}<ul style="padding-left:18px;margin-top:4px">${d.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div><div class="muted" style="text-align:right">${FAM.filter(f=>f.big).map(f=>`${f.name} ${d.readBy.includes(f.id)?'✓ 읽음':'· 안 읽음'}`).join('<br>')}</div></div>`).join('')}</div>`;
}

/* ---------- 가족 화면 ---------- */
function famShell(body){
  const cur=S.page.fam,n=unread(S.who).length,p=me();
  const tabs=[['home','여행',IC.map],['mine','내 준비',IC.bag],['news','소식',IC.bell]];
  return `<div class="fam" style="--fs:${S.big[S.who]?'22px':'18px'}"><button class="sizebtn" data-act="size">${S.big[S.who]?'글씨 작게':'글씨 크게'}</button>${body}</div>
  <nav class="famtabs" aria-label="메뉴">${tabs.map(([k,l,ic])=>`<a href="#" data-nav="${k}" ${k===cur?'aria-current="page"':''}>${svg(ic)}<span>${l}${k==='news'&&n?` <span class="chip tang" style="padding:0 var(--s2)">${n}</span>`:''}</span></a>`).join('')}</nav>`;
}
function dayTitles(d){ /* 부모용 하루 요약: 확정된 활동·이동만, 최대 3줄 */
  const c=conf(d).filter(i=>i.type!=='숙박');return c.slice(0,3).map(i=>`<span>${esc(i.title.replace(/\s*\(.*\)/,''))}</span>`).join('')+(c.length>3?`<span class="muted">외 ${c.length-3}개</span>`:'')||'<span class="muted">아직 정하는 중이에요</span>'}
function fHome(){
  const p=me(),n=unread(S.who).length;
  const stay=d=>{const s=conf(d).filter(i=>i.type==='숙박');const a=s[s.length-1];return a?a.place:''};
  return `<h1>${p.name} 님, 이번 여행</h1>
  <div class="hero" style="margin-top:16px"><div class="muted">제주 4박 5일</div><div class="d">${dayDate(0).getMonth()+1}월 ${dayDate(0).getDate()}일<br>${WD[dayDate(0).getDay()]}요일 출발</div><div class="muted">11월 20일 ~ 24일 · 출발까지 ${dday()}일</div></div>
  ${n?`<button class="banner" data-nav="news"><span>바뀐 소식 ${n}건이 있어요</span><span>보기 ›</span></button>`:''}
  <h2 style="margin:24px 0 12px;font-size:1em">큰 흐름</h2>
  <div class="flow">${[...Array(DAYS).keys()].map(d=>`<button class="dcard" data-open="${d}"><div class="n">${d+1}일차 · ${dfmt(d)}</div><div class="l">${dayTitles(d)}</div>${stay(d)?`<div class="stay">🛏 ${esc(stay(d))}에서 자요</div>`:''}</button>`).join('')}</div>`;
}
const freshFor=i=>{const dg=S.digests.find(x=>x.id===i.fresh);return !!dg&&!dg.readBy.includes(S.who)};
const askBtn=(d,slot)=>S.curious.some(c=>c.day===d&&c.slot===slot&&c.who===S.who)?'<div class="muted" style="margin-top:var(--s2)">✓ 지수 님께 궁금하다고 전했어요</div>':`<button class="btn ghost ask" data-curious="${d}:${slot}">언제 정해지나요?</button>`;
function fDay(){
  const d=S.day,list=conf(d).map(i=>({...i,kind:'c'})).concat(waitingSlots(d).map(w=>({time:w.time,title:`${w.k} · 아직 정하는 중이에요`,kind:'w',slot:w.k}))).sort((a,b)=>a.time.localeCompare(b.time));
  return `<button class="btn ghost small" data-nav="home" style="margin-bottom:16px">‹ 전체 보기</button>
  <h1>${d+1}일차 · ${dfmt(d)}</h1><div class="tl">${list.map(i=>`<div class="ev ${i.meet?'meet':''} ${i.kind==='w'?'wait':''}"><div class="tm">${i.time}</div><div><div class="tt">${i.kind==='w'?'○ ':''}${esc(i.title)}</div>${i.place&&i.kind==='c'?`<div class="muted">${esc(i.place)}</div>`:''}${i.meet?'<span class="chip tang" style="margin-top:var(--s2)">이 시간에 모여요</span>':''}${i.kind==='c'&&freshFor(i)?' <span class="chip tang" style="margin-top:var(--s2)">바뀐 곳</span>':''}${i.kind==='w'?askBtn(d,i.slot):''}</div></div>`).join('')||'<div class="empty">아직 정해진 게 없어요</div>'}</div>
  <div class="row" style="margin-top:24px;gap:12px">${d>0?`<button class="btn ghost big" data-open="${d-1}">‹ 전날</button>`:''}${d<DAYS-1?`<button class="btn ghost big" data-open="${d+1}">다음날 ›</button>`:''}</div>`;
}
function fMine(){
  const l=myTodos(S.who),d=l.filter(t=>t.done[S.who]).length;
  const next=S.items.filter(i=>i.meet&&i.status==='confirmed').sort((a,b)=>a.day-b.day)[0];
  return `<h1>내가 챙길 것</h1>
  ${next?`<div class="card" style="margin:16px 0;border-color:var(--tang);border-width:2px"><div class="muted">처음 모이는 곳</div><div style="font-weight:800;margin-top:4px">${dfmt(next.day)} ${next.time}<br>${esc(next.place||next.title)}</div></div>`:''}
  <p class="muted" style="margin:16px 0">${l.length}개 중 ${d}개 챙겼어요</p>
  ${l.map(t=>`<button class="todo" aria-pressed="${!!t.done[S.who]}" data-todo="${t.id}"><span class="box">${t.done[S.who]?'✓':''}</span><span>${esc(t.title)}</span></button>`).join('')||'<div class="empty">챙길 게 없어요</div>'}`;
}
function fNews(){
  return `<h1>바뀐 소식</h1><p class="muted" style="margin:6px 0 16px">확정된 변경만 모아서 알려드려요.</p>
  ${S.digests.map(dg=>{const n=!dg.readBy.includes(S.who);return `<div class="news ${n?'new':''}"><div class="row between"><b>${dg.at}</b>${n?'<span class="chip tang">새 소식</span>':''}</div><ul style="margin-top:8px">${dg.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>${n?`<button class="btn tang big" data-read="${dg.id}">확인했어요</button>`:''}</div>`}).join('')||'<div class="empty">아직 소식이 없어요</div>'}`;
}

/* ---------- 렌더/라우팅 ---------- */
function render(){
  $('#demo').innerHTML=`<b>보기 전환(데모)</b>`+PEOPLE.map(p=>`<button aria-pressed="${p.id===S.who}" data-who="${p.id}">${p.name} · ${p.role}${p.kind==='fam'&&unread(p.id).length?'<span class="dot"></span>':''}</button>`).join('');
  const m=me();
  if(m.kind==='plan'){const pg=S.page.plan;$('#app').innerHTML=planShell(pg==='edit'?pEdit():pg==='todo'?pTodo():pg==='notify'?pNotify():pHome())}
  else{const pg=S.page.fam;$('#app').innerHTML=famShell(pg==='day'?fDay():pg==='mine'?fMine():pg==='news'?fNews():fHome())}
}
function go(k){const kind=me().kind;S.page[kind]=k;S.editing=null;S.adding=false;render();scrollTo(0,0)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-who],[data-nav],[data-gotoday],[data-curious],[data-day],[data-open],[data-todo],[data-read],[data-act]');if(!t)return;
  if(t.tagName==='A')e.preventDefault();const D=t.dataset;
  if(D.who){document.querySelectorAll('.toast').forEach(x=>x.remove());S.who=D.who;S.page.plan='home';S.page.fam='home';S.editing=null;S.adding=false;render();return scrollTo(0,0)}
  if(D.nav)return go(D.nav);
  if(D.day!==undefined){S.day=+D.day;S.editing=null;return render()}
  if(D.open!==undefined){S.day=+D.open;S.page.fam='day';render();return scrollTo(0,0)}
  if(D.gotoday!==undefined){S.day=+D.gotoday;return go('edit')}
  if(D.curious){const [d,sl]=D.curious.split(':');S.curious.push({day:+d,slot:sl,who:S.who});toast('지수 님께 살짝 전했어요. 재촉은 아니에요');return render()}
  if(D.todo){const td=S.todos.find(x=>x.id===D.todo);td.done[S.who]=td.done[S.who]?0:1;return render()}
  if(D.read){S.digests.find(x=>x.id===D.read).readBy.push(S.who);toast('확인하셨어요. 고맙습니다');return render()}
  const a=D.act,id=D.id,item=S.items.find(i=>i.id===id);
  if(a==='size'){S.big[S.who]=!S.big[S.who];return render()}
  if(a==='instant'){S.instant=!S.instant;return render()}
  if(a==='send'){const n=S.pending.length;publish(S.pending,'방금 (묶음 알림)',false);S.pending=[];toast(`${n}건을 한 번에 알렸어요`);return render()}
  if(a==='drop'){S.pending=S.pending.filter(c=>c.id!==id);toast('이 변경은 알리지 않기로 했어요');return render()}
  if(a==='tdone'){const td=S.todos.find(x=>x.id===id),all=doneCount(td)===td.who.length;td.who.forEach(w=>td.done[w]=all?0:1);return render()}
  if(a==='addform'){S.adding=!S.adding;return render()}
  if(a==='cancel'){S.editing=null;S.adding=false;return render()}
  if(a==='edit'){S.editing=S.editing===id?null:id;return render()}
  if(a==='save'){const o={time:item.time,title:item.title,place:item.place};item.time=$('#e-time').value;item.title=$('#e-title').value;item.place=$('#e-place').value;
    const df=[];if(o.time!==item.time)df.push(`시간 ${o.time} → ${item.time}`);if(o.title!==item.title)df.push(`이름 ${o.title} → ${item.title}`);if(o.place!==item.place)df.push(`장소 ${o.place||'미정'} → ${item.place||'미정'}`);
    if(item.status==='confirmed'&&df.length)record(`${item.day+1}일차 “${o.title}” ${df.join(' · ')}`,item);
    else if(item.status==='candidate')toast('후보를 고쳤어요 (알림 없음)');
    S.editing=null;return render()}
  if(a==='toggle'){
    if(item.status==='candidate'){item.status='confirmed';
      if(item.slot){const rest=S.items.filter(x=>x.slot===item.slot&&x.day===item.day&&x.id!==item.id&&x.status==='candidate');S.items=S.items.filter(x=>!rest.includes(x))}
      record(`${item.day+1}일차 ${item.time} “${item.title}” 확정됐어요`,item);if(item.slot)S.curious=S.curious.filter(c=>!(c.day===item.day&&c.slot===item.slot))}
    else{item.status='candidate';record(`${item.day+1}일차 “${item.title}” 다시 정하는 중이에요`,item)}
    return render()}
  if(a==='up'||a==='down'){const l=dayItems(item.day),ix=l.indexOf(item),j=a==='up'?ix-1:ix+1;if(j<0||j>=l.length)return;
    const other=l[j],ot=[item.time,other.time];item.time=ot[1];other.time=ot[0];
    [[item,ot[0]],[other,ot[1]]].forEach(([x,old])=>{if(x.status==='confirmed')record(`${x.day+1}일차 “${x.title}” 시간 ${old} → ${x.time}`,x)});
    return render()}
  if(a==='del'){S.items=S.items.filter(x=>x!==item);if(item.status==='confirmed')record(`${item.day+1}일차 “${item.title}” 일정이 취소됐어요`,item);else toast('후보를 지웠어요 (알림 없음)');return render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=new FormData(e.target);
  if(e.target.id==='addf'){const x=it(S.day,f.get('type'),f.get('time'),f.get('title'),f.get('place')||'',f.get('status'));S.items.push(x);
    if(x.status==='confirmed')record(`${x.day+1}일차 ${x.time} “${x.title}” 일정이 추가됐어요`,x);else toast('후보로 추가했어요 (알림 없음)');S.adding=false;render()}
  if(e.target.id==='tf'){const w=f.get('who')==='all'?PEOPLE.map(p=>p.id):[f.get('who')];S.todos.push({id:'t'+(++uid),title:f.get('title'),who:w,due:f.get('due'),done:{}});toast('할 일을 추가했어요');render()}
});
render();
</script>
</body>
</html>
